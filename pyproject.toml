[project]
name = "internship-agent"
version = "2.0.0"
description = "Search, contact-resolution, and drafting pipeline for internship outreach, with a human-in-the-loop Gmail send step."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "Flask>=3.1",
    "google-generativeai>=0.8",
    "google-api-python-client>=2.196",
    "google-auth>=2.41",
    "google-auth-oauthlib>=1.2",
    "cryptography>=44",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tavily-python>=0.7",
    "pypdf>=6.0",
]

[project.scripts]
internship-agent = "internship_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["internship_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["internship_agent", "web_app"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["^scripts/manual/", "^tests/"]
